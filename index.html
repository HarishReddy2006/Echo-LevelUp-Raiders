<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ECHO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #030407;
    font-family: 'Trebuchet MS', Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #game-wrap { text-align: center; }
  #title {
    color: #3ddcc8; letter-spacing: 6px; font-size: 13px;
    margin-bottom: 8px; text-transform: uppercase; opacity: 0.85;
  }
  #hint {
    color: #5c6b78; font-size: 12px; margin-top: 8px;
  }
  canvas { border-radius: 8px; box-shadow: 0 0 60px rgba(61,220,200,0.10), 0 0 2px rgba(61,220,200,0.4); }
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
</head>
<body>
<div id="game-wrap">
  <div id="title">E C H O</div>
  <div id="game"></div>
  <div id="hint">Arrows / WASD to move &middot; Up / W to jump &middot; Space to pulse</div>
</div>

<script>
// =====================================================================
// ECHO — a sonar puzzle-platformer
// Core mechanic: press Space to emit a light pulse that briefly reveals
// the level (via Phaser's Lights2D pipeline) before fading back to black.
// This build focuses on production polish: gradient-rendered art,
// particle effects, a title screen, and a styled HUD.
// =====================================================================

const CONFIG_W = 800;
const CONFIG_H = 480;

// ---------------------------------------------------------------------
// Level data.
// ---------------------------------------------------------------------
const LEVELS = [
  {
    name: "Level 1 — First Light",
    playerStart: { x: 60, y: 380 },
    platforms: [
      { x: 0, y: 440, w: 260, h: 40 },
      { x: 320, y: 380, w: 160, h: 24 },
      { x: 540, y: 320, w: 160, h: 24 },
      { x: 720, y: 260, w: 80, h: 220 },
    ],
    hazards: [],
    enemies: [],
    goal: { x: 745, y: 210, w: 30, h: 40 },
    limitedEnergy: false,
  },
  {
    name: "Level 2 — Something Listens",
    playerStart: { x: 60, y: 380 },
    platforms: [
      { x: 0, y: 440, w: 220, h: 40 },
      { x: 280, y: 390, w: 140, h: 20 },
      { x: 470, y: 340, w: 140, h: 20 },
      { x: 660, y: 280, w: 140, h: 200 },
    ],
    hazards: [
      { x: 350, y: 420, w: 40, h: 20 },
    ],
    enemies: [
      { x: 400, y: 360, range: 90 },
      { x: 600, y: 300, range: 110 },
    ],
    goal: { x: 700, y: 230, w: 30, h: 40 },
    limitedEnergy: false,
  },
  {
    name: "Level 3 — The Last Charge",
    playerStart: { x: 60, y: 380 },
    platforms: [
      { x: 0, y: 440, w: 180, h: 40 },
      { x: 240, y: 400, w: 110, h: 20 },
      { x: 400, y: 350, w: 110, h: 20 },
      { x: 560, y: 300, w: 110, h: 20 },
      { x: 700, y: 240, w: 100, h: 240 },
    ],
    hazards: [
      { x: 300, y: 430, w: 36, h: 20 },
      { x: 480, y: 380, w: 36, h: 20 },
    ],
    enemies: [
      { x: 300, y: 370, range: 100 },
      { x: 470, y: 320, range: 100 },
      { x: 630, y: 270, range: 120 },
    ],
    goal: { x: 740, y: 190, w: 30, h: 40 },
    limitedEnergy: true,
  },
];

// ---------------------------------------------------------------------
// Tunable constants
// ---------------------------------------------------------------------
const MOVE_SPEED = 165;
const JUMP_VELOCITY = -420;
const GRAVITY_Y = 900;

const PULSE_MAX_RADIUS = 260;
const PULSE_DURATION_MS = 1500;
const PULSE_COOLDOWN_MS = 250;

const ENERGY_MAX = 100;
const ENERGY_COST = 22;
const ENERGY_REGEN_PER_SEC = 9;

const AMBIENT_SELF_LIGHT_RADIUS = 70;

// Palette
const COL_TEAL = 0x3ddcc8;
const COL_TEAL_HEX = "#3ddcc8";
const COL_INDIGO = 0x6c7bff;
const COL_BG = "#030407";

// =====================================================================
// SOUND — tiny synthesized SFX via Web Audio API, no audio files needed.
// =====================================================================
const SFX = {
  ctx: null,
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
    }
    if (this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  },
  tone(freq, duration, type = "sine", startGain = 0.18, sweep = null) {
    const ctx = this.ensure();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    if (sweep) osc.frequency.exponentialRampToValueAtTime(sweep, ctx.currentTime + duration);
    gain.gain.setValueAtTime(startGain, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  },
  pulse() {
    // rising "ping" — the echo pulse
    this.tone(520, 0.35, "sine", 0.16, 1400);
  },
  jump() {
    this.tone(300, 0.12, "triangle", 0.12, 500);
  },
  alert() {
    // short descending stinger when an enemy locks on
    this.tone(700, 0.18, "sawtooth", 0.1, 220);
  },
  death() {
    this.tone(180, 0.4, "sawtooth", 0.15, 60);
  },
  levelComplete() {
    const ctx = this.ensure();
    [523, 659, 784].forEach((f, i) => {
      setTimeout(() => this.tone(f, 0.3, "sine", 0.14), i * 110);
    });
  },
};


class BootScene extends Phaser.Scene {
  constructor() { super("Boot"); }

  preload() { this.makeTextures(); }

  // Helper: create a texture from a canvas 2D drawing function
  drawTexture(key, w, h, drawFn) {
    const tex = this.textures.createCanvas(key, w, h);
    const ctx = tex.getContext();
    drawFn(ctx, w, h);
    tex.refresh();
  }

  roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  makeTextures() {
    // ---- Player: capsule body with cool gradient + glowing visor ----
    this.drawTexture("player", 24, 32, (ctx, w, h) => {
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, "#eef4f8");
      grad.addColorStop(1, "#aebdc9");
      ctx.fillStyle = grad;
      this.roundRectPath(ctx, 2, 2, w - 4, h - 4, 6);
      ctx.fill();
      ctx.strokeStyle = "rgba(20,30,40,0.5)";
      ctx.lineWidth = 1;
      ctx.stroke();
      // visor
      const visorGrad = ctx.createRadialGradient(w/2, 9, 1, w/2, 9, 6);
      visorGrad.addColorStop(0, "#c9fff5");
      visorGrad.addColorStop(1, COL_TEAL_HEX);
      ctx.fillStyle = visorGrad;
      ctx.beginPath();
      ctx.ellipse(w/2, 9, 6, 4, 0, 0, Math.PI * 2);
      ctx.fill();
    });

    // ---- Platform tile: metallic gradient with bevel + rivets ----
    this.drawTexture("platform", 40, 40, (ctx, w, h) => {
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, "#2f4f6b");
      grad.addColorStop(0.5, "#1f3a52");
      grad.addColorStop(1, "#152a3d");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);
      // top highlight edge
      ctx.fillStyle = "rgba(120,180,210,0.35)";
      ctx.fillRect(0, 0, w, 2);
      // subtle grid line
      ctx.strokeStyle = "rgba(10,20,30,0.5)";
      ctx.lineWidth = 1;
      ctx.strokeRect(0.5, 0.5, w - 1, h - 1);
      // rivets
      ctx.fillStyle = "rgba(160,200,220,0.35)";
      [[6,6],[w-6,6],[6,h-6],[w-6,h-6]].forEach(([rx,ry]) => {
        ctx.beginPath(); ctx.arc(rx, ry, 1.4, 0, Math.PI*2); ctx.fill();
      });
    });

    // ---- Hazard: gradient spikes with sharp highlight ----
    this.drawTexture("hazard", 40, 22, (ctx, w, h) => {
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, "#ff6a52");
      grad.addColorStop(1, "#8f1f18");
      ctx.fillStyle = grad;
      for (let i = 0; i < 2; i++) {
        const bx = i * 20;
        ctx.beginPath();
        ctx.moveTo(bx, h);
        ctx.lineTo(bx + 10, 0);
        ctx.lineTo(bx + 20, h);
        ctx.closePath();
        ctx.fill();
      }
      ctx.strokeStyle = "rgba(255,255,255,0.25)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(10, 0); ctx.lineTo(2, h);
      ctx.moveTo(30, 0); ctx.lineTo(22, h);
      ctx.stroke();
    });

    // ---- Enemies: calm (violet) / alert (red), radial-gradient orbs ----
    this.drawTexture("enemy_calm", 26, 26, (ctx, w, h) => {
      const grad = ctx.createRadialGradient(w/2-3, h/2-4, 1, w/2, h/2, 13);
      grad.addColorStop(0, "#b39cff");
      grad.addColorStop(1, "#5a3f8c");
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(w/2, h/2, 12, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#1c1030";
      ctx.beginPath(); ctx.arc(w/2 - 3, h/2, 1.6, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(w/2 + 3, h/2, 1.6, 0, Math.PI*2); ctx.fill();
    });
    this.drawTexture("enemy_alert", 26, 26, (ctx, w, h) => {
      const grad = ctx.createRadialGradient(w/2-3, h/2-4, 1, w/2, h/2, 13);
      grad.addColorStop(0, "#ffb199");
      grad.addColorStop(1, "#b3281a");
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(w/2, h/2, 12, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#3a0a05";
      ctx.beginPath(); ctx.arc(w/2 - 3, h/2, 1.8, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(w/2 + 3, h/2, 1.8, 0, Math.PI*2); ctx.fill();
    });

    // ---- Goal beacon: glowing teal pillar ----
    this.drawTexture("goal", 32, 42, (ctx, w, h) => {
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, "#c9fff5");
      grad.addColorStop(1, COL_TEAL_HEX);
      ctx.fillStyle = grad;
      this.roundRectPath(ctx, 8, 2, w - 16, h - 4, 6);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.5)";
      ctx.lineWidth = 1;
      ctx.stroke();
    });

    // ---- Soft particle dot (used for dust + pulse sparks) ----
    this.drawTexture("particle_soft", 16, 16, (ctx, w, h) => {
      const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);
      grad.addColorStop(0, "rgba(255,255,255,0.9)");
      grad.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(w/2, h/2, w/2, 0, Math.PI*2); ctx.fill();
    });

    // ---- Vignette overlay (screen-space, camera-pinned) ----
    this.drawTexture("vignette", CONFIG_W, CONFIG_H, (ctx, w, h) => {
      const grad = ctx.createRadialGradient(w/2, h/2, h*0.45, w/2, h/2, h*0.95);
      grad.addColorStop(0, "rgba(0,0,0,0)");
      grad.addColorStop(1, "rgba(0,0,0,0.32)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);
    });
  }

  create() {
    this.scene.start("Title");
  }
}

// =====================================================================
// TITLE SCENE
// =====================================================================
class TitleScene extends Phaser.Scene {
  constructor() { super("Title"); }

  create() {
    this.cameras.main.setBackgroundColor(COL_BG);

    // ambient drifting dust
    this.add.particles(0, 0, "particle_soft", {
      x: { min: 0, max: CONFIG_W },
      y: { min: 0, max: CONFIG_H },
      lifespan: 6000,
      speedY: { min: -6, max: -2 },
      speedX: { min: -3, max: 3 },
      scale: { start: 0.35, end: 0 },
      alpha: { start: 0.25, end: 0 },
      frequency: 220,
      tint: 0x274a63,
    });

    // decorative pulse rings
    const rings = [];
    for (let i = 0; i < 3; i++) {
      const ring = this.add.circle(CONFIG_W / 2, CONFIG_H / 2 - 10, 10, 0x000000, 0);
      ring.setStrokeStyle(2, COL_TEAL, 0.5);
      rings.push(ring);
    }
    this.time.addEvent({
      delay: 1400,
      loop: true,
      callback: () => {
        rings.forEach((r, i) => {
          this.time.delayedCall(i * 220, () => {
            r.radius = 8;
            r.setStrokeStyle(2, COL_TEAL, 0.6);
            this.tweens.add({
              targets: r,
              radius: 180,
              duration: 1400,
              ease: "Cubic.Out",
              onUpdate: () => r.setStrokeStyle(2, COL_TEAL, 0.6 * (1 - r.radius / 180)),
            });
          });
        });
      },
    });
    // kick off immediately too
    rings.forEach((r, i) => {
      this.time.delayedCall(i * 220, () => {
        r.radius = 8;
        this.tweens.add({
          targets: r, radius: 180, duration: 1400, ease: "Cubic.Out",
          onUpdate: () => r.setStrokeStyle(2, COL_TEAL, 0.6 * (1 - r.radius / 180)),
        });
      });
    });

    this.add.text(CONFIG_W / 2, CONFIG_H / 2 - 10, "ECHO", {
      fontFamily: "Georgia, 'Times New Roman', serif", fontSize: "64px", color: "#f5f7fa", fontStyle: "bold",
    }).setOrigin(0.5).setShadow(0, 0, "#3ddcc8", 6, false, true);

    this.add.text(CONFIG_W / 2, CONFIG_H / 2 + 46, "a sonar puzzle-platformer", {
      fontFamily: "Georgia, serif", fontSize: "15px", color: "#8ca0b3", fontStyle: "italic",
    }).setOrigin(0.5);

    const startText = this.add.text(CONFIG_W / 2, CONFIG_H - 70, "PRESS SPACE TO BEGIN", {
      fontFamily: "Trebuchet MS, Arial", fontSize: "14px", color: COL_TEAL_HEX, letterSpacing: 2,
    }).setOrigin(0.5);
    this.tweens.add({ targets: startText, alpha: 0.25, duration: 700, yoyo: true, repeat: -1 });

    this.add.text(CONFIG_W / 2, CONFIG_H - 34, "Arrows/WASD to move · Up/W to jump · Space to pulse", {
      fontFamily: "Trebuchet MS, Arial", fontSize: "11px", color: "#5c6b78",
    }).setOrigin(0.5);

    this.input.keyboard.once("keydown-SPACE", () => {
      SFX.ensure();
      this.cameras.main.fadeOut(300, 0, 0, 0);
      this.time.delayedCall(300, () => this.scene.start("Level", { levelIndex: 0, totalEnergy: ENERGY_MAX }));
    });
  }
}

// =====================================================================
// LEVEL SCENE
// =====================================================================
class LevelScene extends Phaser.Scene {
  constructor() { super("Level"); }

  init(data) {
    this.levelIndex = data.levelIndex || 0;
    this.carryEnergy = data.totalEnergy !== undefined ? data.totalEnergy : ENERGY_MAX;
  }

  create() {
    const level = LEVELS[this.levelIndex];
    this.levelData = level;
    this.cameras.main.setBackgroundColor(COL_BG);
    this.cameras.main.fadeIn(250, 0, 0, 0);

    this.lights.enable();
    this.lights.setAmbientColor(0x06070a);

    // ---- Ambient background dust (very dim, not light-affected — reads as atmosphere) ----
    this.add.particles(0, 0, "particle_soft", {
      x: { min: 0, max: CONFIG_W },
      y: { min: 0, max: CONFIG_H },
      lifespan: 8000,
      speedY: { min: -4, max: -1 },
      speedX: { min: -2, max: 2 },
      scale: { start: 0.25, end: 0 },
      alpha: { start: 0.12, end: 0 },
      frequency: 400,
      tint: 0x1c2c3a,
    }).setDepth(-1);

    // ---- Static platforms ----
    this.platforms = this.physics.add.staticGroup();
    level.platforms.forEach((p) => {
      const cols = Math.ceil(p.w / 40);
      const rows = Math.ceil(p.h / 40);
      for (let cx = 0; cx < cols; cx++) {
        for (let cy = 0; cy < rows; cy++) {
          const tile = this.platforms.create(p.x + cx * 40 + 20, p.y + cy * 40 + 20, "platform");
          tile.setPipeline("Light2D");
        }
      }
    });

    // ---- Hazards ----
    this.hazards = this.physics.add.staticGroup();
    level.hazards.forEach((h) => {
      const hz = this.hazards.create(h.x + h.w / 2, h.y + h.h / 2, "hazard");
      hz.setPipeline("Light2D");
      hz.body.setSize(h.w, h.h * 0.6);
    });

    // ---- Goal (with a soft pulsing halo light so it's findable) ----
    const gd = level.goal;
    this.goal = this.physics.add.staticSprite(gd.x + gd.w / 2, gd.y + gd.h / 2, "goal");
    this.goal.setPipeline("Light2D");
    this.goalLight = this.lights.addLight(this.goal.x, this.goal.y, 40, COL_TEAL, 0.35);
    this.tweens.add({
      targets: this.goalLight, radius: 55, duration: 900, yoyo: true, repeat: -1, ease: "Sine.InOut",
    });

    // ---- Player ----
    this.player = this.physics.add.sprite(level.playerStart.x, level.playerStart.y, "player");
    this.player.setCollideWorldBounds(true);
    this.player.setPipeline("Light2D");
    this.player.body.setSize(20, 28);
    this.facing = 1;

    this.physics.add.collider(this.player, this.platforms);
    this.physics.add.overlap(this.player, this.hazards, () => this.onPlayerDeath(), null, this);
    this.physics.add.overlap(this.player, this.goal, () => this.onLevelComplete(), null, this);

    // ---- Enemies ----
    this.enemies = [];
    level.enemies.forEach((e) => {
      const sprite = this.physics.add.sprite(e.x, e.y, "enemy_calm");
      sprite.setPipeline("Light2D");
      sprite.body.setAllowGravity(false);
      sprite.homeX = e.x;
      sprite.range = e.range;
      sprite.alerted = false;
      sprite.alertUntil = 0;
      sprite.dir = 1;
      this.physics.add.collider(sprite, this.platforms);
      this.physics.add.overlap(this.player, sprite, () => { if (sprite.alerted) this.onPlayerDeath(); }, null, this);
      this.enemies.push(sprite);
    });

    // ---- Ambient self-light ----
    this.selfLight = this.lights.addLight(this.player.x, this.player.y, AMBIENT_SELF_LIGHT_RADIUS, 0x274a63, 0.8);

    // ---- Pulse spark particle emitter ----
    this.pulseParticles = this.add.particles(0, 0, "particle_soft", {
      lifespan: 500,
      speed: { min: 40, max: 90 },
      scale: { start: 0.5, end: 0 },
      alpha: { start: 0.9, end: 0 },
      tint: COL_TEAL,
      emitting: false,
    }).setDepth(60);

    // ---- Input ----
    this.cursors = this.input.keyboard.createCursorKeys();
    this.wasd = this.input.keyboard.addKeys("W,A,S,D,SPACE");
    this.lastPulseTime = -9999;

    // ---- Energy ----
    this.limitedEnergy = level.limitedEnergy;
    this.energy = this.limitedEnergy ? this.carryEnergy : ENERGY_MAX;

    // ---- Vignette overlay ----
    this.add.image(CONFIG_W / 2, CONFIG_H / 2, "vignette").setScrollFactor(0).setDepth(90);

    // ---- HUD panel ----
    const hudPanel = this.add.graphics().setScrollFactor(0).setDepth(99);
    hudPanel.fillStyle(0x0a1526, 0.72);
    hudPanel.fillRoundedRect(10, 8, 250, this.limitedEnergy ? 78 : 40, 8);
    hudPanel.lineStyle(1, 0x1d3348, 1);
    hudPanel.strokeRoundedRect(10, 8, 250, this.limitedEnergy ? 78 : 40, 8);

    this.hudText = this.add.text(22, 16, level.name, {
      fontFamily: "Georgia, serif", fontSize: "15px", color: COL_TEAL_HEX, fontStyle: "bold",
    }).setScrollFactor(0).setDepth(100);

    if (this.limitedEnergy) {
      this.add.text(22, 44, "PULSE ENERGY", {
        fontFamily: "Trebuchet MS, Arial", fontSize: "10px", color: "#7c8a98",
      }).setScrollFactor(0).setDepth(100);
      this.energyBarBg = this.add.rectangle(22, 60, 224, 12, 0x0f1e30).setOrigin(0, 0).setScrollFactor(0).setDepth(100);
      this.energyBarBg.setStrokeStyle(1, 0x2a4a63);
      this.energyBarFg = this.add.rectangle(23, 61, 222, 10, COL_TEAL).setOrigin(0, 0).setScrollFactor(0).setDepth(100);
    }

    this.stateText = this.add.text(CONFIG_W - 16, 18, "", {
      fontFamily: "Georgia, serif", fontSize: "16px", color: "#f5f7fa", fontStyle: "bold",
    }).setOrigin(1, 0).setScrollFactor(0).setDepth(100);

    // level pip indicator (1/2/3)
    const pipY = 20;
    for (let i = 0; i < LEVELS.length; i++) {
      const px = CONFIG_W - 16 - (LEVELS.length - 1 - i) * 16;
      this.add.circle(px, CONFIG_H - 18, 4, i === this.levelIndex ? COL_TEAL : 0x223344)
        .setScrollFactor(0).setDepth(100);
    }

    this.gameOver = false;
    this.pulses = [];
  }

  firePulse() {
    const now = this.time.now;
    if (now - this.lastPulseTime < PULSE_COOLDOWN_MS) return;
    if (this.limitedEnergy && this.energy < ENERGY_COST) return;

    this.lastPulseTime = now;
    if (this.limitedEnergy) this.energy -= ENERGY_COST;
    SFX.pulse();

    const light = this.lights.addLight(this.player.x, this.player.y, 4, 0x8fe9dc, 1.8);
    const pulse = { light, startTime: now, x: this.player.x, y: this.player.y };
    this.pulses.push(pulse);

    pulse.ring = this.add.circle(pulse.x, pulse.y, 4, 0x000000, 0);
    pulse.ring.setStrokeStyle(2, COL_TEAL, 1);
    pulse.ring.setDepth(50);

    // particle burst
    this.pulseParticles.emitParticleAt(pulse.x, pulse.y, 14);
    this.cameras.main.shake(80, 0.002);

    this.enemies.forEach((en) => {
      const d = Phaser.Math.Distance.Between(pulse.x, pulse.y, en.x, en.y);
      if (d < PULSE_MAX_RADIUS) {
        if (!en.alerted) SFX.alert();
        en.alerted = true;
        en.alertUntil = now + 3500;
      }
    });
  }

  onPlayerDeath() {
    if (this.gameOver) return;
    this.gameOver = true;
    SFX.death();
    this.stateText.setText("Caught...");
    this.cameras.main.flash(250, 180, 40, 30);
    this.time.delayedCall(650, () => {
      this.scene.restart({ levelIndex: this.levelIndex, totalEnergy: this.limitedEnergy ? ENERGY_MAX : this.carryEnergy });
    });
  }

  onLevelComplete() {
    if (this.gameOver) return;
    this.gameOver = true;
    SFX.levelComplete();
    this.stateText.setText("Complete!");
    this.cameras.main.flash(300, 61, 220, 200);
    const nextIndex = this.levelIndex + 1;
    this.time.delayedCall(700, () => {
      if (nextIndex < LEVELS.length) {
        this.scene.restart({ levelIndex: nextIndex, totalEnergy: this.energy });
      } else {
        this.scene.start("WinScene");
      }
    });
  }

  update(time, delta) {
    if (this.gameOver) return;
    const dt = delta / 1000;

    if (this.limitedEnergy) {
      this.energy = Math.min(ENERGY_MAX, this.energy + ENERGY_REGEN_PER_SEC * dt);
      this.energyBarFg.width = 222 * (this.energy / ENERGY_MAX);
      this.energyBarFg.fillColor = this.energy < ENERGY_COST ? 0xd94b3a : COL_TEAL;
    }

    const left = this.cursors.left.isDown || this.wasd.A.isDown;
    const right = this.cursors.right.isDown || this.wasd.D.isDown;
    const up = this.cursors.up.isDown || this.wasd.W.isDown;

    if (left) { this.player.setVelocityX(-MOVE_SPEED); this.player.setFlipX(true); this.facing = -1; }
    else if (right) { this.player.setVelocityX(MOVE_SPEED); this.player.setFlipX(false); this.facing = 1; }
    else this.player.setVelocityX(0);

    if (up && this.player.body.blocked.down) { this.player.setVelocityY(JUMP_VELOCITY); SFX.jump(); }

    if (Phaser.Input.Keyboard.JustDown(this.wasd.SPACE)) this.firePulse();

    this.selfLight.x = this.player.x;
    this.selfLight.y = this.player.y;

    if (this.player.y > CONFIG_H + 100) this.onPlayerDeath();

    const now = this.time.now;
    this.pulses = this.pulses.filter((p) => {
      const t = (now - p.startTime) / PULSE_DURATION_MS;
      if (t >= 1) {
        p.light.intensity = 0;
        this.lights.removeLight(p.light);
        p.ring.destroy();
        return false;
      }
      const radius = PULSE_MAX_RADIUS * Math.min(1, t * 2.0);
      const fade = 1 - t;
      p.light.radius = 6 + radius;
      p.light.intensity = 1.8 * fade;
      p.ring.radius = radius;
      p.ring.setStrokeStyle(2, COL_TEAL, Math.max(0, fade));
      return true;
    });

    this.enemies.forEach((en) => {
      if (en.alerted && now > en.alertUntil) en.alerted = false;
      en.setTexture(en.alerted ? "enemy_alert" : "enemy_calm");
      if (en.alerted) {
        const dir = this.player.x > en.x ? 1 : -1;
        en.setVelocityX(dir * 90);
      } else {
        if (Math.abs(en.x - en.homeX) > en.range / 2) en.dir *= -1;
        en.setVelocityX(en.dir * 40);
      }
    });
  }
}

// =====================================================================
// WIN SCENE
// =====================================================================
class WinScene extends Phaser.Scene {
  constructor() { super("WinScene"); }
  create() {
    this.cameras.main.setBackgroundColor(COL_BG);
    this.cameras.main.fadeIn(400, 0, 0, 0);

    this.add.particles(0, 0, "particle_soft", {
      x: { min: 0, max: CONFIG_W }, y: CONFIG_H + 10,
      lifespan: 3000, speedY: { min: -60, max: -20 }, speedX: { min: -10, max: 10 },
      scale: { start: 0.5, end: 0 }, alpha: { start: 0.8, end: 0 },
      frequency: 60, tint: [COL_TEAL, 0x6c7bff],
    });

    this.add.text(CONFIG_W / 2, CONFIG_H / 2 - 30, "YOU REACHED THE SURFACE", {
      fontFamily: "Georgia, serif", fontSize: "28px", color: COL_TEAL_HEX, fontStyle: "bold",
    }).setOrigin(0.5).setShadow(0, 0, "#3ddcc8", 5, false, true);

    this.add.text(CONFIG_W / 2, CONFIG_H / 2 + 15, "Press R to play again", {
      fontFamily: "Trebuchet MS, Arial", fontSize: "15px", color: "#8ca0b3",
    }).setOrigin(0.5);

    this.input.keyboard.once("keydown-R", () => {
      this.scene.start("Level", { levelIndex: 0, totalEnergy: ENERGY_MAX });
    });
  }
}

// =====================================================================
// GAME CONFIG
// =====================================================================
const config = {
  type: Phaser.AUTO,
  width: CONFIG_W,
  height: CONFIG_H,
  parent: "game",
  backgroundColor: COL_BG,
  physics: {
    default: "arcade",
    arcade: { gravity: { y: GRAVITY_Y }, debug: false },
  },
  scene: [BootScene, TitleScene, LevelScene, WinScene],
};

new Phaser.Game(config);
</script>
